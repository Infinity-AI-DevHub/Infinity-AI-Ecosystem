# app.iinfinityai.com — the public web surface.
#
# Serves three screens: share links, account activation, password reset. Nothing here is
# authenticated, and the bundle contains none of the workspace.
#
# Site root in aaPanel: /www/wwwroot/infinity/apps/web/dist-public

# Client-side routes: /shared/<token>, /activate, /reset. Anything that is not a file on
# disk is handed to the app, which decides what to show.
location / {
    try_files $uri $uri/ /index.html;
}

# Hashed filenames never change contents, so they can be cached indefinitely.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# The shell must never be cached, or people keep running yesterday's build against
# today's API.
location = /index.html {
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
