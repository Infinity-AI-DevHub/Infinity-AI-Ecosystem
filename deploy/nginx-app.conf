# app.iinfinityai.com — the public website.
#
# Complete aaPanel server block. Replace the whole contents of the site's
# "Configuration File" with this.
#
# In the panel first:
#   PHP            -> "Pure static"
#   Site directory -> /www/wwwroot/infinity/apps/web/dist-public
#
# This serves the slim public bundle only: share links, account activation and
# password reset. The authenticated application is not in this build and must
# never be copied here.

server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name app.iinfinityai.com;
    index index.html;
    root /www/wwwroot/infinity/apps/web/dist-public;
    include /www/server/panel/vhost/nginx/extension/app.iinfinityai.com/*.conf;

    #SSL-START SSL related configuration, do NOT delete or modify the next line of commented-out 404 rules
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/app.iinfinityai.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/app.iinfinityai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:RSA+AES128:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"';
    quic_retry on;
    quic_gso on;
    ssl_early_data on;
    error_page 497  https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START  Error page configuration, allowed to be commented, deleted or modified
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP reference configuration, allowed to be commented, deleted or modified
    # Intentionally empty: set the site to "Pure static" in the panel. Nothing here is
    # PHP, and an enabled interpreter is reachable attack surface for no benefit.
    #PHP-INFO-END
    # 404 is deliberately not mapped to a static page. Unknown paths fall through to
    # index.html below, because /shared/<token> and /activate are client-side routes.

    #REWRITE-START URL rewrite rule reference, any modification will invalidate the rewrite rules set by the panel
    include /www/server/panel/vhost/rewrite/app.iinfinityai.com.conf;
    #REWRITE-END

    # Forbidden files or directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    # Directory verification for one-click SSL certificate renewal
    location ~ \.well-known {
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # aaPanel's default `location ~ .*\.(js|css)?$` block is removed. A regex location
    # outranks a prefix location, so it would have captured /assets/*.js before the
    # block below — serving the bundle with a 12-hour expiry and none of these headers.
    # The ^~ prefix here is belt and braces against the same rule being reintroduced.
    location ^~ /assets/ {
        # Vite fingerprints these filenames, so the content at a given URL never changes.
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # The shell must never be cached, or people run yesterday's build against today's
    # API and see failures no deployment can explain.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Every unmatched path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log  /www/wwwlogs/app.iinfinityai.com.log;
    error_log  /www/wwwlogs/app.iinfinityai.com.error.log;
}
