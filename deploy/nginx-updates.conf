# updates.iinfinityai.com — installers and the update feed.
#
# Static files only. Site root in aaPanel:
#   /www/wwwroot/infinity/updates
#
# Upload the .dmg and .exe from apps/desktop/release, plus latest.json.

# The client re-reads this to decide whether a new version exists, so a cached copy would
# hide releases for as long as the cache lived.
location = /latest.json {
    add_header Cache-Control "no-store" always;
    default_type application/json;
}

location / {
    # Installers are large and immutable once published.
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    # Serve as a download rather than letting a browser try to display it.
    add_header Content-Disposition "attachment" always;
}
