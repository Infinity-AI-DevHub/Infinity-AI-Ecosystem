# updates.iinfinityai.com — installers and the update feed.
#
# Complete aaPanel server block. Replace the whole contents of the site's
# "Configuration File" with this.
#
# In the panel first:
#   PHP            -> "Pure static"
#   Site directory -> /www/wwwroot/infinity/updates
#
# Publish a release by copying the contents of apps/desktop/release/ here:
#   latest.json, the .exe, the .dmg files, and their .blockmap sidecars.

server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name updates.iinfinityai.com;
    root /www/wwwroot/infinity/updates;
    include /www/server/panel/vhost/nginx/extension/updates.iinfinityai.com/*.conf;

    #SSL-START SSL related configuration, do NOT delete or modify the next line of commented-out 404 rules
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/updates.iinfinityai.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/updates.iinfinityai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:RSA+AES128:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"';
    quic_retry on;
    quic_gso on;
    ssl_early_data on;
    error_page 497  https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START  Error page configuration, allowed to be commented, deleted or modified
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP reference configuration, allowed to be commented, deleted or modified
    # Intentionally empty: set the site to "Pure static" in the panel. Nothing here is
    # PHP, and an enabled interpreter is reachable attack surface for no benefit.
    #PHP-INFO-END

    #REWRITE-START URL rewrite rule reference, any modification will invalidate the rewrite rules set by the panel
    include /www/server/panel/vhost/rewrite/updates.iinfinityai.com.conf;
    #REWRITE-END

    # Forbidden files or directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    # Directory verification for one-click SSL certificate renewal
    location ~ \.well-known {
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # Installed clients re-read this to discover new versions. A cached copy hides a
    # release for as long as the cache lives — including a release shipped to fix
    # something urgent.
    location = /latest.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # No directory listing: nothing here should be browsable, only fetched by name.
    autoindex off;

    # Installers are immutable once published — a given version is never rebuilt.
    location / {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Force a download rather than letting a browser try to render a binary.
        add_header Content-Disposition "attachment" always;
    }

    access_log  /www/wwwlogs/updates.iinfinityai.com.log;
    error_log  /www/wwwlogs/updates.iinfinityai.com.error.log;
}
