# app-api.iinfinityai.com — the API.
#
# Complete aaPanel server block. Replace the whole contents of the site's
# "Configuration File" with this. Every panel-managed marker (#SSL-START/END,
# #REWRITE-START/END, #ERROR-PAGE-START/END) is preserved so the panel can still
# renew certificates and rewrite rules without clobbering the application config.
#
# In the panel first: set PHP to "Pure static". Nothing here is served from disk.

server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name app-api.iinfinityai.com;
    root /www/wwwroot/app-api.iinfinityai.com;
    include /www/server/panel/vhost/nginx/extension/app-api.iinfinityai.com/*.conf;

    #SSL-START SSL related configuration, do NOT delete or modify the next line of commented-out 404 rules
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/app-api.iinfinityai.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/app-api.iinfinityai.com/privkey.pem;
    # TLS 1.1 is deprecated and disabled in every current browser. Leaving it enabled
    # only makes weak negotiation available to something old enough to ask for it.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:RSA+AES128:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"';
    quic_retry on;
    quic_gso on;
    # ssl_early_data is deliberately OFF here. 0-RTT data is replayable, and this
    # server accepts state-changing requests carrying a session token.
    ssl_early_data off;
    error_page 497  https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START  Error page configuration, allowed to be commented, deleted or modified
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP reference configuration, allowed to be commented, deleted or modified
    # Intentionally empty: set the site to "Pure static" in the panel. Nothing here is
    # PHP, and an enabled interpreter is reachable attack surface for no benefit.
    #PHP-INFO-END

    #REWRITE-START URL rewrite rule reference, any modification will invalidate the rewrite rules set by the panel
    include /www/server/panel/vhost/rewrite/app-api.iinfinityai.com.conf;
    #REWRITE-END

    # Forbidden files or directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    # Directory verification for one-click SSL certificate renewal
    location ~ \.well-known {
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # aaPanel's default static-cache regex blocks are removed on purpose. A regex
    # location outranks a prefix location in nginx, so `location ~ .*\.(js|css)?$`
    # would capture API paths before `location /` ever sees them.

    # Everything is the API. It sets its own security headers, CORS and cache rules;
    # adding another set here produces duplicates browsers handle inconsistently.
    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The rate limiter and the audit trail both record the caller's address.
        # Without this every request appears to come from the proxy, and per-IP
        # limits protect nobody.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Realtime. Without the upgrade headers the socket fails and the desktop app
        # sits on "Reconnecting" with no other symptom.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long enough that an idle WebSocket is not cut every minute.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Uploads pass through this proxy; the API enforces its own 250 MB ceiling.
        client_max_body_size 260m;
        proxy_request_buffering off;
    }

    access_log  /www/wwwlogs/app-api.iinfinityai.com.log;
    error_log  /www/wwwlogs/app-api.iinfinityai.com.error.log;
}
