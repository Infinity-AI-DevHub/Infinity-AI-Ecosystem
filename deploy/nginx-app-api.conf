# app-api.iinfinityai.com — the API.
#
# Paste the location blocks into the aaPanel site's "Configuration File" editor. aaPanel
# writes the server, listen, TLS and certbot lines itself, so only what is specific to
# this application belongs here.

# The API sets its own security headers, CORS and cache rules. Adding another set here
# would produce duplicates that browsers handle inconsistently.
location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # The rate limiter and the audit trail both record the caller's address. Without this
    # every request appears to come from the proxy and per-IP limits protect nobody.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Realtime. Without the upgrade headers the socket silently falls back to failing,
    # and the app looks like it has simply lost connection.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Long enough that an idle WebSocket is not cut every minute.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    # File uploads go through this proxy; the API enforces its own 250 MB ceiling.
    client_max_body_size 260m;
    proxy_request_buffering off;
}
