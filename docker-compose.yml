# Local development stack. Production uses managed equivalents (blueprint 13).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infinity
      POSTGRES_PASSWORD: infinity_dev_only
      POSTGRES_DB: infinity
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U infinity -d infinity']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. Buckets stay private; access is via signed URLs only.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: infinity
      MINIO_ROOT_PASSWORD: infinity_dev_only
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Malware scanning for uploads and mail attachments.
  clamav:
    image: clamav/clamav:stable
    ports: ['3310:3310']
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # Local SMTP sink: captures outbound mail without delivering it to the internet.
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']

volumes:
  pgdata:
  miniodata:
