# Local development stack. Production uses managed equivalents (blueprint 13).
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecosystem
    # The server runs in UTC; the application also pins each connection, so the two
    # agree no matter how the host is configured.
    command: >-
      --default-time-zone=+00:00
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    # 3307 avoids colliding with a locally installed MySQL (MAMP uses 8889).
    ports: ['3307:3306']
    volumes: ['mysqldata:/var/lib/mysql']
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-proot']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. Buckets stay private; access is via signed URLs only.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: infinity
      MINIO_ROOT_PASSWORD: infinity_dev_only
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Malware scanning for uploaded files.
  clamav:
    image: clamav/clamav:stable
    ports: ['3310:3310']
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s


volumes:
  mysqldata:
  miniodata:
