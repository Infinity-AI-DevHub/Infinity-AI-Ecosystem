# nginx does not merge add_header across levels: a location block that declares even one
# add_header discards every header inherited from the server block. The caching rules
# below are per-location, so these must be included explicitly in each of them - without
# that, index.html itself was served with no CSP, no HSTS and no frame protection, which
# is precisely the document where they matter most.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# connect-src names the API origin substituted at image build time. It is deliberately
# not a blanket "https: wss:" - that would let injected script reach any host on the
# internet, which removes most of the point of having a policy at all.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ${API_ORIGIN} ${API_WS_ORIGIN}; upgrade-insecure-requests" always;
